
name: Collect Followers V3 PHP

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Diagnose PHP API response
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          COLLECTOR_TOKEN: ${{ secrets.COLLECTOR_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import urllib.request
          import urllib.error

          url = os.environ["SITE_URL"].rstrip("/") + "/api/pages.php"
          token = os.environ["COLLECTOR_TOKEN"]

          req = urllib.request.Request(
              url,
              headers={
                  "Authorization": "Bearer " + token,
                  "Accept": "application/json"
              }
          )

          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  body = response.read()
                  print("HTTP:", response.status)
                  print("Content-Type:", response.headers.get("Content-Type"))
                  print("Response length:", len(body))
                  print("Response starts with HTML:",
                        body.lstrip().lower().startswith(
                            (b"<!doctype html", b"<html")
                        ))
                  print("Response is JSON:",
                        body.lstrip().startswith((b"{", b"[")))
          except urllib.error.HTTPError as e:
              print("HTTP error:", e.code)
          except Exception as e:
              print("Connection error:", type(e).__name__, str(e))
          PY

      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Collect public followers and send to PHP API
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          COLLECTOR_TOKEN: ${{ secrets.COLLECTOR_TOKEN }}
        run: python collector/collector.py
