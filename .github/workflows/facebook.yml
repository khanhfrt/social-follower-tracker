
name: Test Facebook Followers V2

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Test Facebook public pages
        env:
          TARGET_PAGE: https://www.facebook.com/FPTShop37LTT
        run: python collector.py

      - name: Save results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: facebook-v2-results
          path: output/
          if-no-files-found: warn
